<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedLink IQ | Dubai Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { background: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(59, 130, 246, 0.2); border-radius: 1.5rem; }
        #map { height: 500px; border-radius: 1rem; width: 100%; border: 1px solid rgba(255,255,255,0.05); }
        .prio-1 { border-left: 5px solid #ef4444 !important; } /* Critical */
        .prio-2 { border-left: 5px solid #f59e0b !important; } /* Urgent */
        .prio-3 { border-left: 5px solid #10b981 !important; } /* Standard */
        select option { background: #0f172a; color: white; }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-6">
            <div>
                <h1 class="text-4xl font-black text-blue-500 tracking-tighter italic">MEDLINK<span class="text-white">IQ</span></h1>
                <p class="text-slate-500 text-xs font-bold tracking-widest uppercase">Biological & Pharmaceutical Logistics Optimizer</p>
            </div>
            <div class="text-right hidden md:block">
                <p class="text-[10px] font-bold text-slate-500 uppercase">Algorithm</p>
                <p class="text-blue-400 text-sm font-mono">PRIORITY-WEIGHTED GREEDY</p>
            </div>
        </header>

        <div class="grid lg:grid-cols-4 gap-8">
            <div class="lg:col-span-1 space-y-6">
                <div class="glass p-6">
                    <h2 class="text-xs font-bold text-blue-400 mb-4 uppercase tracking-widest">1. Destination</h2>
                    <select id="hospInp" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm mb-4 mt-1 focus:ring-2 focus:ring-blue-500 outline-none">
                        <!-- Static defaults for GitHub Pages view -->
                        <option value="Al Zahra Hospital">Al Zahra Hospital</option>
                        <option value="Rashid Hospital">Rashid Hospital</option>
                        <option value="Dubai Hospital">Dubai Hospital</option>
                        <!-- Flask dynamic loop stays here for local VS Code runs -->
                        {% for name in hospitals %}
                            <option value="{{ name }}">{{ name }}</option>
                        {% endfor %}
                    </select>

                    <h2 class="text-xs font-bold text-blue-400 mb-4 uppercase tracking-widest">2. Medical Asset</h2>
                    <select id="assetInp" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm mb-4 mt-1 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option>Organ Transplant</option>
                        <option>Blood Units (O-Neg)</option>
                        <option>Emergency Medicines</option>
                        <option>Vaccine Cold-Chain</option>
                        <option>Oxygen Supply</option>
                    </select>

                    <h2 class="text-xs font-bold text-blue-400 mb-4 uppercase tracking-widest">3. Priority Level</h2>
                    <select id="prioInp" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm mb-6 mt-1 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="1">LEVEL 1 - CRITICAL</option>
                        <option value="2">LEVEL 2 - URGENT</option>
                        <option value="3">LEVEL 3 - STANDARD</option>
                    </select>

                    <button onclick="addToManifest()" class="w-full bg-blue-600 hover:bg-blue-500 p-3 rounded-xl font-bold transition-all shadow-lg shadow-blue-900/20 active:scale-95">
                        Add to Manifest
                    </button>
                </div>

                <div class="glass p-6">
                    <h2 class="text-xs font-bold text-slate-400 mb-2 uppercase italic">Live Traffic Density</h2>
                    <input type="range" id="traffic" min="1" max="2" step="0.1" value="1" class="w-full accent-blue-500 mb-4">
                    <button onclick="runOptimization()" class="w-full bg-white text-black p-4 rounded-xl font-black uppercase tracking-widest text-sm hover:bg-blue-50 transition-all shadow-xl active:scale-95">
                        Optimize Lifeline
                    </button>
                </div>
            </div>

            <div class="lg:col-span-3 space-y-6">
                <div id="map" class="shadow-2xl z-10"></div>
                
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="glass p-4 overflow-hidden">
                        <p class="text-[10px] text-slate-500 font-bold uppercase mb-2 italic">Active Manifest</p>
                        <ul id="manifestList" class="space-y-2 max-h-32 overflow-y-auto text-[10px]"></ul>
                    </div>
                    <div class="glass p-4 text-center border-b-4 border-blue-500">
                        <p class="text-[10px] text-slate-500 font-bold uppercase">Total Distance</p>
                        <p id="res-dist" class="text-2xl font-mono text-blue-400">0.0 KM</p>
                    </div>
                    <div class="glass p-4 text-center border-b-4 border-emerald-500">
                        <p class="text-[10px] text-slate-500 font-bold uppercase">Travel Time</p>
                        <p id="res-time" class="text-2xl font-mono text-emerald-400">0 MIN</p>
                    </div>
                    <div class="glass p-4 text-center border-b-4 border-amber-500 relative overflow-hidden">
                        <p class="text-[10px] text-slate-500 font-bold uppercase">Priority Cost</p>
                        <p id="res-cost" class="text-2xl font-mono text-amber-400">0.0 AED</p>
                        <div class="absolute top-0 right-0 p-1 bg-amber-500/10 text-[8px] font-bold text-amber-500">PREMIUM</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([25.0617, 55.2472], 11);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OSM contributors'
        }).addTo(map);
        
        const hubIcon = L.circleMarker([25.0617, 55.2472], {
            radius: 10, color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 1, weight: 2
        }).addTo(map).bindPopup("<b>DSP CENTRAL HUB</b>");

        let manifest = [];
        let markers = [];
        let routePath = null;

        function addToManifest() {
            const h = document.getElementById('hospInp').value;
            const a = document.getElementById('assetInp').value;
            const p = document.getElementById('prioInp').value;

            if(manifest.some(item => item.name === h)) return alert("Destination already in manifest.");

            manifest.push({name: h, supply: a, priority: p});
            
            const li = document.createElement('li');
            li.className = `p-2 bg-slate-800/50 rounded prio-${p}`;
            li.innerHTML = `<span class="font-bold text-white">${h}</span><br><span class="text-slate-400">${a}</span>`;
            document.getElementById('manifestList').appendChild(li);
        }

        async function runOptimization() {
            if(manifest.length === 0) return alert("Add destinations first.");

            try {
                const res = await fetch('/optimize', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ stops: manifest, traffic: document.getElementById('traffic').value })
                });
                const data = await res.json();

                document.getElementById('res-dist').innerText = data.distance + " KM";
                document.getElementById('res-time').innerText = data.time + " MIN";
                document.getElementById('res-cost').innerText = data.cost + " AED";

                if(routePath) map.removeLayer(routePath);
                markers.forEach(m => map.removeLayer(m));
                markers = [];

                const coords = data.path.map(p => [p.lat, p.lng]);
                routePath = L.polyline(coords, { color: '#3b82f6', weight: 4, dashArray: '10, 15', opacity: 0.8 }).addTo(map);

                data.path.forEach((p, i) => {
                    if(i > 0 && i < data.path.length-1) {
                        const color = p.priority == 1 ? '#ef4444' : (p.priority == 2 ? '#f59e0b' : '#10b981');
                        const m = L.circleMarker([p.lat, p.lng], { radius: 8, color: color, fillColor: color, fillOpacity: 1 }).addTo(map);
                        m.bindPopup(`<b>${p.name}</b><br>Priority: ${p.priority}`);
                        markers.push(m);
                    }
                });
                map.fitBounds(routePath.getBounds(), {padding: [50, 50]});
            } catch (e) {
                alert("Backend not found. Please run local Flask server for optimization logic.");
            }
        }
    </script>
</body>
</html>
